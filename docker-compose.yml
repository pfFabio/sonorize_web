services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sonorize_backend
    ports:
      - "8001:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: sonorize_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend